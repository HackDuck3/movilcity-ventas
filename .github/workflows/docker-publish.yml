# Construye la imagen Docker para Raspberry Pi (arm64) y PC (amd64) y la publica en GitHub Container Registry.
# Se ejecuta al subir una etiqueta de versión (git tag v1.2.0) o a mano desde la pestaña "Actions".
name: Publicar imagen Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión desde package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Nombre de la imagen en minúsculas
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/movilcity-ventas" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Movil City - control de ventas
